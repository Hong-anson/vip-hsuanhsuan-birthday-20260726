<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎂 2026.07.26 軒軒專屬約會通行證</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background: linear-gradient(135deg, #fff0f3 0%, #fdf8f5 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #4a4a4a;
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 10px 0 4px 0;
            font-size: 17px;
            font-weight: bold;
            color: #d46a6a;
            letter-spacing: 1px;
        }
        .swiper {
            width: 100%;
            height: calc(100vh - 45px);
            height: calc(100dvh - 45px);
            padding-bottom: 30px;
            box-sizing: border-box;
        }
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 5px 12px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 360px;
            height: 96%;
            max-height: 530px;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(212, 106, 106, 0.15);
            display: flex;
            flex-direction: column;
            padding: 16px 18px;
            box-sizing: border-box;
            position: relative;
            border: 2px solid #ffe3e8;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }
        .time-badge {
            align-self: flex-start;
            background: #ff4d6d;
            color: white;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            box-shadow: 0 3px 8px rgba(255, 77, 109, 0.3);
            flex-shrink: 0;
        }
        .card h2 {
            color: #333;
            font-size: 19px;
            margin: 0 0 10px 0;
            line-height: 1.25;
            flex-shrink: 0;
        }
        .card-img-box {
            width: 100%;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            flex-shrink: 0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
        }
        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .map-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fdf2f4;
            color: #d46a6a;
            border: 1px solid #ffccd5;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 10px;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            flex-shrink: 0;
        }
        .map-btn:active {
            background: #ffe0e6;
            transform: scale(0.98);
        }
        .desc {
            font-size: 14px;
            line-height: 1.45;
            color: #555;
            flex-grow: 1;
            white-space: pre-line;
        }
        .note-box {
            background: #fff0f3;
            border-left: 4px solid #ff4d6d;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #d46a6a;
            margin-top: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .locked-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            background: #fafafa;
            border: 2px dashed #ffb3c0;
            border-radius: 14px;
            padding: 12px;
            margin-top: 5px;
        }
        .locked-icon {
            font-size: 40px;
            margin-bottom: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .timer-box {
            background: #ff4d6d;
            color: white;
            font-size: 15px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 10px;
            margin-top: 12px;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
            letter-spacing: 1px;
        }
        /* 🔐 通關密語專屬樣式 */
        .pin-container {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .pin-input {
            width: 150px;
            padding: 10px;
            font-size: 22px;
            text-align: center;
            letter-spacing: 8px;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            outline: none;
            color: #d46a6a;
            font-weight: bold;
            background: #ffffff;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.2s;
        }
        .pin-input:focus {
            border-color: #ff4d6d;
            box-shadow: 0 0 8px rgba(255, 77, 109, 0.3);
        }
        .pin-error {
            color: #e63946;
            font-size: 12px;
            margin-top: 8px;
            display: none;
            font-weight: bold;
            animation: shake 0.3s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .early-unlock-link {
            font-size: 11px;
            color: #aaa;
            text-decoration: underline;
            margin-top: 14px;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .swipe-hint {
            position: absolute;
            bottom: 6px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #aaa;
            letter-spacing: 1px;
        }
        .swiper-pagination-bullet-active {
            background: #ff4d6d !important;
        }
    </style>
</head>
<body>

    <div class="header">🎂 軒軒 VIP 專屬約會通行證 🎂</div>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="card-wrapper">
            <div class="swiper-slide">
                <div class="card" style="justify-content: center; align-items: center;">
                    <h3 style="color:#d46a6a;">⏳ 正在連線試算表載入中...</h3>
                </div>
            </div>
        </div>
        <div class="swiper-pagination"></div>
        <div class="swipe-hint">👉 往左／往右滑動切換行程 👈</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // =========================================================================
        // 🚨 【設定 1】：通關密語 (預設為你的生日 0302，可隨時修改為 1552 或 0524)
        const SECRET_PIN = "0524"; 

        // 🔗 【設定 2】：永久綁定你的 Google 試算表 CSV
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTIZlbBSdvCM40aIyduz3Jfhkbse_r9btX_i-Nvy51fUQUOZxpJvBfEb9RkLtn9qY0QwSQXzrq19GKC/pub?output=csv"; 

        // 🚨 【設定 3】：壓軸解鎖時間 (設定為 2026/07/26 晚間 20:15:00)
        const UNLOCK_TIME = new Date("2026-07-26T20:15:00").getTime();
        // =========================================================================

        let countdownInterval = null;
        let currentDataArray = [];
        let isPinUnlocked = false; // 記錄密碼是否已解鎖成功
        let forceShowPin = false;  // 記錄是否啟動了「提早輸入密語」

        function safeGet(row, targetKey) {
            for (let key in row) {
                if (key.trim().toLowerCase() === targetKey.toLowerCase()) {
                    return row[key] ? row[key].trim() : "";
                }
            }
            return "";
        }

        // 🤖 智慧地圖導航
        function getMapUrl(row) {
            const customMap = safeGet(row, "map");
            if (customMap && (customMap.toLowerCase() === "none" || customMap.toLowerCase() === "hide" || customMap.toLowerCase() === "no")) {
                return "";
            }

            const text = (safeGet(row, "title") + safeGet(row, "desc") + safeGet(row, "time")).toLowerCase();
            if (text.includes("首部曲") || text.includes("12:30") || text.includes("府上") || text.includes("軒軒家") || text.includes("迎接")) {
                return "";
            }
            if (customMap && customMap.startsWith("http")) return customMap;
            if (text.includes("二部曲") || text.includes("13:00") || text.includes("午宴") || text.includes("私房")) {
                return "https://maps.app.goo.gl/9qS47j2QydASZAGQ6";
            }
            if (text.includes("noke") || text.includes("忠泰") || text.includes("三部曲") || text.includes("蔦屋") || text.includes("展覽")) {
                return "https://www.google.com/maps/search/?api=1&query=NOKE+忠泰樂生活";
            }
            if (text.includes("頁小館") || text.includes("四部曲") || text.includes("派對") || text.includes("18:30")) {
                return "https://www.google.com/maps/search/?api=1&query=Restaurant+Page+頁小館";
            }
            if (text.includes("薇閣") || text.includes("壓軸") || text.includes("任務") || text.includes("20:30")) {
                return "https://www.google.com/maps/search/?api=1&query=大直薇閣精品旅館";
            }
            return "";
        }

        // 🔐 驗證通關密語邏輯
        function checkPinAuto(el) {
            const errorEl = document.getElementById('pin-error');
            if (errorEl) errorEl.style.display = "none";
            el.style.borderColor = "#ffccd5";

            // 當輸入滿 4 位數時，毫秒自動比對！
            if (el.value.length === 4) {
                if (el.value === SECRET_PIN) {
                    isPinUnlocked = true;
                    el.style.borderColor = "#48c774";
                    el.style.backgroundColor = "#effaf3";
                    setTimeout(() => {
                        renderCards(currentDataArray); // 驗證成功！重新渲染顯示終極卡片
                    }, 300);
                } else {
                    if (errorEl) errorEl.style.display = "block";
                    el.style.borderColor = "#e63946";
                    el.value = ""; // 答錯自動清空，方便她再猜一次
                }
            }
        }

        // 🔑 司機特許：點擊提前開啟密碼框
        function triggerEarlyPin() {
            forceShowPin = true;
            renderCards(currentDataArray);
        }

        function renderCards(dataArray) {
            currentDataArray = dataArray;
            const wrapper = document.getElementById('card-wrapper');
            wrapper.innerHTML = ""; 

            const now = new Date().getTime();

            dataArray.forEach((row, index) => {
                const timeStr = safeGet(row, "time");
                const titleStr = safeGet(row, "title");
                const descStr = safeGet(row, "desc");
                const imgStr = safeGet(row, "img");
                const noteStr = safeGet(row, "note");
                const mapUrl = getMapUrl(row);

                if (!titleStr && !timeStr) return;

                const isLastCard = (index === dataArray.length - 1);
                // 🔒 雙重鎖判定：如果是最後一頁，且「還沒成功解鎖過密碼」，卡片就是鎖定的！
                const isLocked = isLastCard && (!isPinUnlocked);

                const slide = document.createElement('div');
                slide.className = 'swiper-slide';

                if (isLocked) {
                    const isTimeUp = (now >= UNLOCK_TIME) || forceShowPin;

                    if (!isTimeUp) {
                        // 狀態 1：【倒數中】時間還沒到，顯示倒數計時與提早解鎖小字
                        slide.innerHTML = `
                            <div class="card">
                                <div class="time-badge" style="background:#888;">${timeStr || '神秘壓軸'}</div>
                                <h2>${titleStr || '？？？神秘目的地？？？'}</h2>
                                
                                <div class="locked-box">
                                    <div class="locked-icon">🎁</div>
                                    <h3 style="color:#d46a6a; margin:0 0 6px 0;">最高機密・雙重鎖定中</h3>
                                    <p style="color:#666; font-size:13px; line-height:1.4; margin:0;">
                                        為維持最高度的驚喜與期待感<br>此關卡需等待<b>倒數歸零</b>並輸入<b>通關密語</b>！
                                    </p>
                                    <div id="mystery-timer" class="timer-box">計算倒數中...</div>
                                    <div class="early-unlock-link" onclick="triggerEarlyPin()">🔑 司機特許：點此提前輸入密語解鎖</div>
                                </div>

                                <div class="note-box" style="border-color:#888; color:#666; text-align:center;">
                                    🔒 解鎖時間：2026/07/26 晚間 20:15
                                </div>
                            </div>
                        `;
                    } else {
                        // 狀態 2：【密碼解鎖】時間到（或按了提前解鎖），顯示 4 位數密碼輸入框！
                        slide.innerHTML = `
                            <div class="card">
                                <div class="time-badge" style="background:#ff4d6d;">🔐 密語解鎖關卡</div>
                                <h2>${titleStr || '？？？神秘目的地？？？'}</h2>
                                
                                <div class="locked-box" style="border-color:#ff4d6d; background:#fff9fa;">
                                    <div class="locked-icon">🔑</div>
                                    <h3 style="color:#d46a6a; margin:0 0 6px 0;">請輸入 4 位數通關密語</h3>
                                    <p style="color:#666; font-size:13px; line-height:1.4; margin:0;">
                                        💡 提示：這個數字，是只有我們能聯想到的專屬默契！
                                    </p>
                                    <div class="pin-container">
                                        <input type="tel" id="pin-code" class="pin-input" maxlength="4" placeholder="••••" autocomplete="off" inputmode="numeric" pattern="[0-9]*" oninput="checkPinAuto(this)" autofocus>
                                        <div id="pin-error" class="pin-error">❌ 密語錯誤，再猜猜看！</div>
                                    </div>
                                </div>

                                <div class="note-box" style="text-align:center;">
                                    🎉 第一重時間鎖已解除！請輸入密語打開大禮！
                                </div>
                            </div>
                        `;
                    }
                } else {
                    // 🔓 狀態 3：【完美解鎖】密碼正確！顯示完整圖文內容與 Google 地圖導航！
                    let imgHtml = imgStr !== "" ? `<div class="card-img-box"><img src="${imgStr}" alt="image"></div>` : "";
                    let mapHtml = mapUrl !== "" ? `<a href="${mapUrl}" target="_blank" class="map-btn">📍 點我開啟 Google 地圖導航 ↗</a>` : "";
                    let noteHtml = noteStr !== "" ? `<div class="note-box">${noteStr}</div>` : "";

                    slide.innerHTML = `
                        <div class="card">
                            <div class="time-badge">${timeStr || '約會行程'}</div>
                            <h2>${titleStr || ''}</h2>
                            ${imgHtml}
                            ${mapHtml}
                            <div class="desc">${descStr || ''}</div>
                            ${noteHtml}
                        </div>
                    `;
                }
                wrapper.appendChild(slide);
            });

            new Swiper(".mySwiper", {
                effect: "slide",
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 1,
                spaceBetween: 20,
                pagination: { el: ".swiper-pagination", clickable: true },
                touchReleaseOnEdges: true
            });

            startTimerCheck();
        }

        function startTimerCheck() {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = UNLOCK_TIME - now;
                const timerEl = document.getElementById('mystery-timer');

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    // 時間到了！如果還沒顯示密碼框、也還沒解鎖，自動重新渲染成「密碼輸入介面」
                    if (!isPinUnlocked && !forceShowPin) {
                        forceShowPin = true;
                        renderCards(currentDataArray);
                    }
                } else if (timerEl) {
                    const hours = Math.floor(distance / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    timerEl.innerHTML = `⏳ 倒數 ${hours}時 ${minutes}分 ${seconds}秒`;
                }
            }, 1000);
        }

        Papa.parse(GOOGLE_SHEET_CSV_URL, {
            download: true, 
            header: true,
            complete: (res) => renderCards(res.data),
            error: (err) => console.error("CSV載入失敗：", err)
        });
    </script>
</body>
</html>
