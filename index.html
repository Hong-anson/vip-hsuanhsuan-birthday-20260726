<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎂 2026.07.26 軒軒專屬約會通行證</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background: linear-gradient(135deg, #fff0f3 0%, #fdf8f5 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #4a4a4a;
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 10px 0 4px 0;
            font-size: 17px;
            font-weight: bold;
            color: #d46a6a;
            letter-spacing: 1px;
        }
        .swiper {
            width: 100%;
            height: calc(100vh - 45px);
            height: calc(100dvh - 45px);
            padding-bottom: 30px;
            box-sizing: border-box;
        }
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 5px 12px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 360px;
            height: 96%;
            max-height: 530px;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(212, 106, 106, 0.15);
            display: flex;
            flex-direction: column;
            padding: 16px 18px;
            box-sizing: border-box;
            position: relative;
            border: 2px solid #ffe3e8;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }
        .time-badge {
            align-self: flex-start;
            background: #ff4d6d;
            color: white;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            box-shadow: 0 3px 8px rgba(255, 77, 109, 0.3);
            flex-shrink: 0;
        }
        .card h2 {
            color: #333;
            font-size: 19px;
            margin: 0 0 10px 0;
            line-height: 1.25;
            flex-shrink: 0;
        }
        .card-img-box {
            width: 100%;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            flex-shrink: 0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
        }
        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* 📍 專屬 Google Map 導航按鈕美化 */
        .map-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fdf2f4;
            color: #d46a6a;
            border: 1px solid #ffccd5;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 10px;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            flex-shrink: 0;
        }
        .map-btn:active {
            background: #ffe0e6;
            transform: scale(0.98);
        }
        .desc {
            font-size: 14px;
            line-height: 1.45;
            color: #555;
            flex-grow: 1;
            white-space: pre-line;
        }
        .note-box {
            background: #fff0f3;
            border-left: 4px solid #ff4d6d;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #d46a6a;
            margin-top: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .locked-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            background: #fafafa;
            border: 2px dashed #ffb3c0;
            border-radius: 14px;
            padding: 12px;
            margin-top: 5px;
        }
        .locked-icon {
            font-size: 40px;
            margin-bottom: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .timer-box {
            background: #ff4d6d;
            color: white;
            font-size: 15px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 10px;
            margin-top: 12px;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
            letter-spacing: 1px;
        }
        .swipe-hint {
            position: absolute;
            bottom: 6px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #aaa;
            letter-spacing: 1px;
        }
        .swiper-pagination-bullet-active {
            background: #ff4d6d !important;
        }
    </style>
</head>
<body>

    <div class="header">🎂 軒軒 VIP 專屬約會通行證 🎂</div>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="card-wrapper">
            <div class="swiper-slide">
                <div class="card" style="justify-content: center; align-items: center;">
                    <h3 style="color:#d46a6a;">⏳ 正在連線試算表載入中...</h3>
                </div>
            </div>
        </div>
        <div class="swiper-pagination"></div>
        <div class="swipe-hint">👉 往左／往右滑動切換行程 👈</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // =========================================================================
        // 🔗 永久綁定你的 Google 試算表 CSV
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTIZlbBSdvCM40aIyduz3Jfhkbse_r9btX_i-Nvy51fUQUOZxpJvBfEb9RkLtn9qY0QwSQXzrq19GKC/pub?output=csv"; 

        // 🚨 壓軸解鎖時間 (嚴格設定為 2026/07/26 晚間 20:15:00)
        const UNLOCK_TIME = new Date("2026-07-26T20:15:00").getTime();
        // =========================================================================

        let countdownInterval = null;
        let currentDataArray = [];

        function safeGet(row, targetKey) {
            for (let key in row) {
                if (key.trim().toLowerCase() === targetKey.toLowerCase()) {
                    return row[key] ? row[key].trim() : "";
                }
            }
            return "";
        }

        // 🤖 智慧導航產生器：自動匹配五大行程地圖，也支援試算表 `map` 欄位
        function getMapUrl(row) {
            const customMap = safeGet(row, "map");
            if (customMap && customMap.startsWith("http")) return customMap;

            const text = (safeGet(row, "title") + safeGet(row, "desc") + safeGet(row, "time")).toLowerCase();
            if (text.includes("忠孝") || text.includes("首部曲") || text.includes("花園")) {
                return "https://www.google.com/maps/search/?api=1&query=台北市大安區建國南路一段與忠孝東路三段交叉口";
            }
            if (text.includes("美麗華") || text.includes("奧德賽") || text.includes("二部曲")) {
                return "https://www.google.com/maps/search/?api=1&query=大直美麗華影城";
            }
            if (text.includes("noke") || text.includes("忠泰") || text.includes("三部曲")) {
                return "https://www.google.com/maps/search/?api=1&query=NOKE+忠泰樂生活";
            }
            if (text.includes("頁小館") || text.includes("四部曲") || text.includes("派對")) {
                return "https://www.google.com/maps/search/?api=1&query=Restaurant+Page+頁小館";
            }
            if (text.includes("薇閣") || text.includes("壓軸") || text.includes("任務")) {
                return "https://www.google.com/maps/search/?api=1&query=大直薇閣精品旅館";
            }
            return "";
        }

        function renderCards(dataArray) {
            currentDataArray = dataArray;
            const wrapper = document.getElementById('card-wrapper');
            wrapper.innerHTML = ""; 

            const now = new Date().getTime();

            dataArray.forEach((row, index) => {
                const timeStr = safeGet(row, "time");
                const titleStr = safeGet(row, "title");
                const descStr = safeGet(row, "desc");
                const imgStr = safeGet(row, "img");
                const noteStr = safeGet(row, "note");
                const mapUrl = getMapUrl(row);

                if (!titleStr && !timeStr) return;

                const isLastCard = (index === dataArray.length - 1);
                const isLocked = isLastCard && (now < UNLOCK_TIME);

                const slide = document.createElement('div');
                slide.className = 'swiper-slide';

                if (isLocked) {
                    // 🔒 鎖定狀態：完全藏匿地圖連結與按鈕！
                    slide.innerHTML = `
                        <div class="card">
                            <div class="time-badge" style="background:#888;">${timeStr || '神秘壓軸'}</div>
                            <h2>${titleStr || '？？？神秘目的地？？？'}</h2>
                            
                            <div class="locked-box">
                                <div class="locked-icon">🎁</div>
                                <h3 style="color:#d46a6a; margin:0 0 10px 0;">最高機密・鎖定中</h3>
                                <p style="color:#666; font-size:14px; line-height:1.5; margin:0;">
                                    為維持最高度的驚喜與期待感<br>詳細地點與任務內容將於晚餐後揭曉！
                                </p>
                                <div id="mystery-timer" class="timer-box">計算倒數中...</div>
                            </div>

                            <div class="note-box" style="border-color:#888; color:#666; text-align:center;">
                                🔒 解鎖時間：2026/07/26 晚間 20:15
                            </div>
                        </div>
                    `;
                } else {
                    // 🔓 正常解鎖：精美呈現「📍 點我看 Google 地圖導航」按鈕
                    let imgHtml = imgStr !== "" ? `<div class="card-img-box"><img src="${imgStr}" alt="image"></div>` : "";
                    let mapHtml = mapUrl !== "" ? `<a href="${mapUrl}" target="_blank" class="map-btn">📍 點我開啟 Google 地圖導航 ↗</a>` : "";
                    let noteHtml = noteStr !== "" ? `<div class="note-box">${noteStr}</div>` : "";

                    slide.innerHTML = `
                        <div class="card">
                            <div class="time-badge">${timeStr || '約會行程'}</div>
                            <h2>${titleStr || ''}</h2>
                            ${imgHtml}
                            ${mapHtml}
                            <div class="desc">${descStr || ''}</div>
                            ${noteHtml}
                        </div>
                    `;
                }
                wrapper.appendChild(slide);
            });

            new Swiper(".mySwiper", {
                effect: "slide",
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 1,
                spaceBetween: 20,
                pagination: { el: ".swiper-pagination", clickable: true },
                touchReleaseOnEdges: true
            });

            startTimerCheck();
        }

        function startTimerCheck() {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = UNLOCK_TIME - now;
                const timerEl = document.getElementById('mystery-timer');

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    if (timerEl) renderCards(currentDataArray);
                } else if (timerEl) {
                    const hours = Math.floor(distance / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    timerEl.innerHTML = `⏳ 倒數 ${hours}時 ${minutes}分 ${seconds}秒`;
                }
            }, 1000);
        }

        Papa.parse(GOOGLE_SHEET_CSV_URL, {
            download: true, 
            header: true,
            complete: (res) => renderCards(res.data),
            error: (err) => console.error("CSV載入失敗：", err)
        });
    </script>
</body>
</html>
